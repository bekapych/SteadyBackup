[workspace]
resolver = "2"
members = ["crates/steady-core", "crates/steady-service"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
winapi = "0.3.9"
flate2 = "1"
encoding_rs = "0.8"
regex = "1"
# Распаковка обновлений 1С: старые архивы сжаты deflate/deflate64.
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
native-tls = "0.2"
